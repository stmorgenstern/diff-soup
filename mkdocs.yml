site_name: diff-soup
site_description: Differentiable, GPU-native JAX library for stiff PDEs and DAEs
site_url: https://stmorgenstern.github.io/diff-soup/
repo_url: https://github.com/stmorgenstern/diff-soup
repo_name: stmorgenstern/diff-soup

theme:
  name: material
  logo: assets/logo.png
  favicon: assets/favicon.png
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - content.code.copy
    - search.suggest
    - search.highlight
    - toc.follow
  palette:
    # Institute Navy -- picked from the 3-direction design review. Its
    # candidates (Soup Blue, Field Notes) are kept as a reference palette
    # at the top of extra.css for reuse elsewhere (admonitions, plots).
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

hooks:
  - docs_hooks.py

plugins:
  - search
  - autorefs
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: ["."]
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true
            heading_level: 3
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            show_bases: false
            separate_signature: true
            show_signature_annotations: true
            members_order: source
            filters: ["!^_"]
            relative_crossrefs: true
            scoped_crossrefs: true
            # griffe warns for every documented-but-unannotated parameter in
            # existing docstrings, which fails --strict on code the docs
            # cannot change. Cross-reference resolution still warns through
            # mkdocs-autorefs, which is the check that guards these pages.
            docstring_options:
              warnings: false
  - mkdocs-jupyter:
      execute: false
      include_source: true

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

extra_css:
  - stylesheets/extra.css

